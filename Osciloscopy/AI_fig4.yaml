measurement_rules:
  - "Use the PNG to identify the Vdd ramp, the 90% Vdd crossing, and the HZ-to-active transition on CLK Output."
  - "T_start is measured from the time Vdd reaches its rated minimum value to the first valid clock edge, per Table 1."
  - "This timing applies to devices configured in OE mode or ST (Standby) mode on pin 1."
  - "Do not confuse T_start (power-up) with T_resume (Figure 5, resume from Standby) or T_oe (Figures 6-7, OE enable/disable)."
