schema_version: "1.1"
ai_orientation:
  purpose: "Machine-readable interpretation of Figure 3, the output waveform definition for rise/fall time and duty cycle."
  source_markdown: "Context.md"
  source_image: "fig3.png"
figure:
  id: "fig3"
  title: "Waveform"
  type: "timing_waveform"
  timing_parameters: ["tr", "tf", "TH", "TL", "Period", "Duty Cycle"]
visual_interpretation:
  purpose: "Defines rise time (tr), fall time (tf), high pulse width (TH), low pulse width (TL), and period of the LVCMOS output, using 20% Vdd, 50%, and 80% Vdd voltage reference levels."
  thresholds:
    rise_fall_measurement: "20% Vdd to 80% Vdd"
    fifty_percent_reference: "50% used as the crossing point defining TH, TL, and Period boundaries"
associated_requirements:
  duty_cycle:
    formula: "Duty Cycle = TH / Period"
    parameter: "DC"
    min: 45
    max: 55
    unit: "%"
    condition: "All Vdd levels"
    note_ref: "[8]"
  rise_fall_time:
    parameter: "Tr, Tf"
    values:
      - vdd: "2.25 V - 3.63 V"
        typ: 1.5
        max: 3
        unit: "ns"
      - vdd: "1.8 V"
        typ: 1.3
        max: 2.5
        unit: "ns"
    measurement_window: "20% - 80%"
related_figures:
  - "fig2"
measurement_rules:
  - "Use the PNG for waveform shape, threshold lines, and labeled intervals (tr, tf, TH, TL, Period)."
  - "Rise time (tr) and fall time (tf) are measured between the 20% Vdd and 80% Vdd crossings."
  - "TH (high pulse) and TL (low pulse) are measured at the 50% Vdd crossing."
  - "Duty Cycle is computed as TH divided by Period, per note [8]."
  - "Use the YAML/Table 1 values for numeric limits; do not infer them from pixel distances."
  - "This waveform is measured at Vout under the Figure 2 test circuit (15 pF load)."
source_integrity:
  verified_by_user: true
