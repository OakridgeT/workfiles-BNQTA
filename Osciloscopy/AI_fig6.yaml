associated_requirements:
  parameter: "T_oe"
  definition: "Enable/Disable Time — enable direction (time to re-enable the clock output)"
  max: 130
  unit: "ns"
  condition: "f = 110 MHz. For other frequencies, T_oe = 100 ns + 3 * cycles"
