measurement_rules:
  - "Use the PNG to identify the OE Voltage ramp, the 50% Vdd crossing, and the HZ-to-active transition on CLK Output."
  - "T_oe (enable direction) is measured from the time OE crosses the 50% Vdd threshold to the first valid clock edge."
  - "The 130 ns maximum applies at f = 110 MHz; for other frequencies use T_oe = 100 ns + 3 cycles of the operating frequency."
  - "This figure applies only to devices operating in OE (Output Enable) mode; it complements Figure 7 (OE disable)."
  - "Do not confuse this enable-direction T_oe with T_start (Figure 4) or T_resume (Figure 5)."
