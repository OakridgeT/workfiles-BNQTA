schema_version: "1.2"
ai_orientation:
  purpose: "Machine-readable interpretation of Figure 6.1-a."
  source_markdown: "Tables_related.md"
  source_image: "6.1-a.png"
figure:
  id: "6.1-a"
  title: "VOLTAGE WAVEFORMS — PULSE DURATION"
  type: "timing_waveform"
  timing_parameter: "tw"
visual_interpretation:
  purpose: "Shows the high or low pulse duration of CLK."
  measure: "Pulse width of CLK at the applicable voltage reference level."
waveform_geometry:
  rows:
    - name: "Input"
      rails: {high: "V_I", low: "0 V"}
      transitions:
        - order: 1
          direction: "falling"
          crossing: "V_M"
          note: "First V_M crossing; signal goes from V_I to 0 V."
        - order: 2
          direction: "rising"
          crossing: "V_M"
          note: "Second V_M crossing; signal returns from 0 V to V_I."
  intervals:
    - label: "tw"
      measured_between: ["transition 1 crossing", "transition 2 crossing"]
      note: "tw is the horizontal distance between the two V_M crossings. As drawn, the interval spans the LOW portion of the pulse (tw for CLK low). The identical measurement method — the time between two consecutive V_M crossings — applies symmetrically to measure the HIGH portion of the pulse (tw for CLK high, a rising crossing followed by a falling crossing), which is not separately illustrated in this figure."
associated_requirements:
  parameter: "tw"
  definition: "Pulse duration, CLK high or low"
  unit: "ns"
  min_by_vcc:
    "1.8 V ± 0.15 V": 2.5
    "2.5 V ± 0.2 V": 2.5
    "3.3 V ± 0.3 V": 2.5
    "5.5 V ± 0.5 V": 2.5
frequency_requirement:
  parameter: "fclock"
  max: 160
  unit: "MHz"
  vcc: ["1.8 V ± 0.15 V", "2.5 V ± 0.2 V", "3.3 V ± 0.3 V", "5.5 V ± 0.5 V"]
test_context:
  temperature_ranges: ["-40°C to +85°C", "-40°C to +125°C"]
  switching_characteristics_load: "CL = 15 pF"
measurement_rules:
  - "Use the PNG for waveform geometry and threshold locations."
  - "tw applies to CLK high or low pulse duration."
  - "Do not confuse tw with tpd, tsu, or th."
  - "All parameters and waveforms are not necessarily applicable to all devices."
source_integrity:
  verified_by_user: true
