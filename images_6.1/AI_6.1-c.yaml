schema_version: "1.2"
ai_orientation:
  purpose: "Machine-readable interpretation of Figure 6.1-c."
  source_markdown: "Tables_related.md"
  source_image: "6.1-c.png"
figure:
  id: "6.1-c"
  title: "VOLTAGE WAVEFORMS — SETUP AND HOLD TIMES"
  type: "timing_waveform"
  timing_parameters: ["tsu", "th"]
visual_interpretation:
  purpose: "Shows the required data stability interval before and after the active CLK rising edge."
parameter_definitions:
  tsu: "Setup time before CLK rising edge."
  th: "Hold time for data after CLK rising edge."
waveform_geometry:
  rows:
    - name: "Timing Input (CLK)"
      rails: {high: "V_I", low: "0 V"}
      notation: "Segments away from the drawn transition are dashed, meaning 'not specified / don't care' — a standard timing-diagram convention. Only the single drawn transition is the defined reference edge; dashed segments must not be read as additional real transitions."
      transitions:
        - order: 1
          direction: "rising"
          crossing: "V_M"
          role: "reference edge for both tsu and th"
    - name: "Data Input"
      rails: {high: "V_I", low: "0 V"}
      transitions:
        - order: 1
          direction: "falling"
          crossing: "V_M"
          note: "Occurs before the CLK reference edge; marks the start of tsu."
        - order: 2
          direction: "rising"
          crossing: "V_M"
          note: "Occurs after the CLK reference edge; marks the end of th."
  intervals:
    - label: "tsu"
      measured_between: ["Data Input transition 1 crossing", "Timing Input reference-edge crossing"]
    - label: "th"
      measured_between: ["Timing Input reference-edge crossing", "Data Input transition 2 crossing"]
  data_state_at_capture: "As drawn, Data is LOW (0 V) throughout the interval spanned by tsu and th (it falls before the CLK edge and rises after it) — this specific drawing illustrates the 'Data low' row of tsu in the requirements table. A mirrored drawing (Data rising before the edge, falling after) would illustrate the 'Data high' tsu row. Select the table row matching the actual logic level Data holds across the CLK edge being analyzed, not the direction of any single transition taken in isolation."
requirements:
  temperature_ranges: ["-40°C to +85°C", "-40°C to +125°C"]
  tsu_data_high:
    "1.8 V ± 0.15 V": 2.3
    "2.5 V ± 0.2 V": 1.5
    "3.3 V ± 0.3 V": 1.3
    "5.5 V ± 0.5 V": 1.1
    unit: "ns"
  tsu_data_low:
    "1.8 V ± 0.15 V": 2.5
    "2.5 V ± 0.2 V": 1.5
    "3.3 V ± 0.3 V": 1.3
    "5.5 V ± 0.5 V": 1.1
    unit: "ns"
  th:
    "1.8 V ± 0.15 V": 0
    "2.5 V ± 0.2 V": 0.2
    "3.3 V ± 0.3 V": 0.9
    "5.5 V ± 0.5 V": 0.4
    unit: "ns"
clock_requirement:
  fclock_max: 160
  unit: "MHz"
measurement_rules:
  - "Use the PNG to identify the CLK rising edge and data transitions."
  - "tsu is the interval immediately before the CLK rising edge during which data must satisfy the specified condition."
  - "th is the interval immediately after the CLK rising edge during which data must remain valid."
  - "Do not confuse tsu/th with propagation delay."
  - "All parameters and waveforms are not necessarily applicable to all devices."
source_integrity:
  verified_by_user: true
