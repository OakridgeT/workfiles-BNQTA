schema_version: "1.2"
ai_orientation:
  purpose: "Machine-readable interpretation of Figure 6.1-b."
  source_markdown: "Tables_related.md"
  source_image: "6.1-b.png"
figure:
  id: "6.1-b"
  title: "VOLTAGE WAVEFORMS — PROPAGATION DELAY TIMES INVERTING AND NONINVERTING OUTPUTS"
  type: "timing_waveform"
  timing_parameter: "tpd"
visual_interpretation:
  purpose: "Shows propagation delay between CLK input transition and Q output transition for the applicable output polarity."
parameter_mapping:
  tPLH: "tpd"
  tPHL: "tpd"
  tPLH_meaning: "low-to-high output propagation transition"
  tPHL_meaning: "high-to-low output propagation transition"
waveform_geometry:
  rows:
    - name: "Input"
      rails: {high: "V_I", low: "0 V"}
      transitions:
        - order: 1
          direction: "falling"
          crossing: "V_M"
        - order: 2
          direction: "rising"
          crossing: "V_M"
    - name: "Output (upper row)"
      role: "inverting output"
      rails: {high: "V_OH", low: "V_OL"}
      transitions:
        - order: 1
          direction: "rising"
          crossing: "V_M"
          triggered_by: "Input transition 1 (falling)"
          interval_label: "tPLH"
        - order: 2
          direction: "falling"
          crossing: "V_M"
          triggered_by: "Input transition 2 (rising)"
          interval_label: "tPHL"
    - name: "Output (lower row)"
      role: "noninverting output"
      rails: {high: "V_OH", low: "V_OL"}
      transitions:
        - order: 1
          direction: "falling"
          crossing: "V_M"
          triggered_by: "Input transition 1 (falling)"
          interval_label: "tPHL"
        - order: 2
          direction: "rising"
          crossing: "V_M"
          triggered_by: "Input transition 2 (rising)"
          interval_label: "tPLH"
  disambiguation: "Both Output rows respond to the SAME pair of Input transitions but in OPPOSITE directions: the upper (inverting) output rises when the lower (noninverting) output falls, and vice versa. Which label applies (tPLH vs tPHL) is determined by the DIRECTION of the specific output transition being measured — rising output = tPLH, falling output = tPHL — not by row position or by the Input's own direction."
switch_context:
  S1_for_propagation: "Open"
switching_characteristics:
  condition: "TA = -40°C to +85°C, CL = 15 pF"
  tpd:
    "1.8 V ± 0.15 V": {min: 3, max: 9.1, unit: "ns"}
    "2.5 V ± 0.2 V": {min: 1.5, max: 6, unit: "ns"}
    "3.3 V ± 0.3 V": {min: 1.3, max: 4.2, unit: "ns"}
    "5 V ± 0.5 V": {min: 1.1, max: 3.8, unit: "ns"}
frequency:
  fmax: 160
  unit: "MHz"
measurement_rules:
  - "Use the PNG to identify the input and output transitions and their polarity."
  - "Propagation delay is measured between the applicable input and output reference crossings shown in the waveform."
  - "Do not interpret tPLH/tPHL as setup or hold time."
  - "Outputs are measured one at a time, with one transition per measurement."
  - "All parameters and waveforms are not necessarily applicable to all devices."
source_integrity:
  verified_by_user: true
