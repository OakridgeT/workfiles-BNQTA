circuit_topology:
  description: "The 'From Output Under Test' node feeds a shared junction with two parallel branches to ground: CL (load capacitance, see Note A) and a shunt RL (load resistance to ground). From the same junction, the signal continues in series through a second, separate resistor also labeled RL to switch S1, which selects one of three terminations: V_LOAD, Open, or GND."
  ambiguity_note: "The schematic reuses the label 'R_L' for two different resistors — one shunt (output node to ground) and one in series (junction to S1). The RL column in the electrical-conditions table (1 kOhm or 500 Ohm depending on VCC) gives a single value; both resistors are physically distinct components in the same signal path — do not collapse them into one resistor when describing the circuit."
