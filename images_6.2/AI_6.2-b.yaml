schema_version: "1.2"
ai_orientation:
  purpose: "Machine-readable interpretation context for Figure 6.2-b."
  source_markdown: "Tables_related.md"
  source_verified: true
  source_image: "6.2-b.png"
figure:
  id: "6.2-b"
  title: "VOLTAGE WAVEFORMS — PROPAGATION DELAY TIMES INVERTING AND NONINVERTING OUTPUTS"
  type: "timing_waveform"
  timing_concept: "propagation delay"
parameters:
  primary: ["tPLH", "tPHL"]
  equivalent_parameter: "tpd"
  measurement_relation: "Measure propagation delay between the specified input and output reference transitions using the waveform thresholds shown in the image."
waveform_geometry:
  rows:
    - name: "Input"
      rails: {high: "V_I", low: "0 V"}
      transitions:
        - order: 1
          direction: "falling"
          crossing: "V_M"
        - order: 2
          direction: "rising"
          crossing: "V_M"
    - name: "Output (upper row)"
      role: "inverting output"
      rails: {high: "V_OH", low: "V_OL"}
      transitions:
        - order: 1
          direction: "rising"
          crossing: "V_M"
          triggered_by: "Input transition 1 (falling)"
          interval_label: "tPLH"
        - order: 2
          direction: "falling"
          crossing: "V_M"
          triggered_by: "Input transition 2 (rising)"
          interval_label: "tPHL"
    - name: "Output (lower row)"
      role: "noninverting output"
      rails: {high: "V_OH", low: "V_OL"}
      transitions:
        - order: 1
          direction: "falling"
          crossing: "V_M"
          triggered_by: "Input transition 1 (falling)"
          interval_label: "tPHL"
        - order: 2
          direction: "rising"
          crossing: "V_M"
          triggered_by: "Input transition 2 (rising)"
          interval_label: "tPLH"
  disambiguation: "Both Output rows respond to the SAME pair of Input transitions but in OPPOSITE directions: the upper (inverting) output rises when the lower (noninverting) output falls, and vice versa. Which label applies (tPLH vs tPHL) is determined by the DIRECTION of the specific output transition being measured — rising output = tPLH, falling output = tPHL — not by row position or by the Input's own direction."
switching_characteristics:
  table_5_9:
    condition: "TA = -40°C to +85°C, CL = 30 pF or 50 pF"
    tpd:
      "1.8 V ± 0.15 V": {min: 4.4, max: 9.9, unit: "ns"}
      "2.5 V ± 0.2 V": {min: 2.3, max: 7, unit: "ns"}
      "3.3 V ± 0.3 V": {min: 2, max: 5.2, unit: "ns"}
      "5 V ± 0.5 V": {min: 1.3, max: 4.5, unit: "ns"}
  table_5_10:
    condition: "TA = -40°C to +125°C, CL = 30 pF or 50 pF"
    tpd:
      "1.8 V ± 0.15 V": {min: 4.4, max: 12.5, unit: "ns"}
      "2.5 V ± 0.2 V": {min: 2.3, max: 8.5, unit: "ns"}
      "3.3 V ± 0.3 V": {min: 2, max: 6, unit: "ns"}
      "5 V ± 0.5 V": {min: 1.3, max: 5.5, unit: "ns"}
conditions:
  applicable_tables: ["5.9", "5.10"]
  temperature_ranges: ["-40°C to +85°C", "-40°C to +125°C"]
  vcc_values: ["1.8 V ± 0.15 V", "2.5 V ± 0.2 V", "3.3 V ± 0.3 V", "5 V ± 0.5 V"]
visual_grounding:
  inspect: ["input transition", "output transition", "rising/falling edge", "reference threshold", "time interval"]
semantic_rules:
  - "tPLH and tPHL are the same as tpd in the source notes."
  - "Use the PNG to identify waveform polarity and reference transitions."
  - "Use Tables_related.md for numerical minimum and maximum tpd values."
  - "Do not assume a single tpd value applies across VCC or temperature conditions."
