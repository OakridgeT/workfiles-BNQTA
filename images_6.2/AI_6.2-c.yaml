schema_version: "1.0"
ai_orientation:
  purpose: "Machine-readable interpretation metadata for Figure 6.2-c."
  source_markdown: "Tables_related.md"
  source_image: "6.2-c.png"
figure:
  id: "6.2-c"
  type: "timing_waveform"
  title: "VOLTAGE WAVEFORMS — SETUP AND HOLD TIMES"
  parameters: ["tsu", "th"]
visual_semantics:
  primary_signals: ["data", "clock", "output"]
  measurement_concept: "The figure represents the required setup interval before the active clock/reference edge and the required hold interval after that edge."
  visual_grounding: "Use the PNG to identify the active clock edge, data transition, timing arrows, and reference voltage levels."
timing:
  tsu:
    definition: "Setup time: minimum interval during which the input data must be stable before the specified clock edge."
    unit: "ns"
  th:
    definition: "Hold time: minimum interval during which the input data must remain stable after the specified clock edge."
    unit: "ns"
conditions:
  temperature_ranges: ["-40°C to +85°C", "-40°C to +125°C"]
  load_capacitance: ["30 pF", "50 pF"]
measurement_rules:
  - "Setup and hold are measured relative to the relevant clock/reference edge."
  - "Do not interpret tsu or th as propagation delay."
  - "Use the PNG for the exact edge relationship and the associated datasheet table for numerical limits."
ai_interpretation_rules:
  - "Determine the active clock edge from the waveform before interpreting tsu or th."
  - "For tsu, measure backward from the active clock edge to the relevant data transition."
  - "For th, measure forward from the active clock edge to the relevant data transition."
  - "Do not infer a numerical limit from drawing scale alone."
