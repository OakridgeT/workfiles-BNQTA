parameters:
  primary: "tW"
  definition: "Pulse duration represented by the time interval for which the waveform remains in its active state, according to the figure's threshold convention."
waveform_geometry:
  rows:
    - name: "Input"
      rails: {high: "V_I", low: "0 V"}
      transitions:
        - order: 1
          direction: "falling"
          crossing: "V_M"
          note: "First V_M crossing; signal goes from V_I to 0 V."
        - order: 2
          direction: "rising"
          crossing: "V_M"
          note: "Second V_M crossing; signal returns from 0 V to V_I."
  intervals:
    - label: "tW"
      measured_between: ["transition 1 crossing", "transition 2 crossing"]
      note: "tW is the horizontal distance between the two V_M crossings. As drawn, the interval spans the LOW portion of the pulse. The identical measurement method — the time between two consecutive V_M crossings — applies symmetrically to the HIGH portion of the pulse (a rising crossing followed by a falling crossing), which is not separately illustrated in this figure."
